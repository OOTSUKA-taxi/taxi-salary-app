<title>給料計算アプリ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2e3354;
    --accent: #f0c040;
    --text: #e8eaf2;
    --text-dim: #7a80a0;
    --green: #4cdd88;
    --red: #ff6060;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    padding: 0 0 80px;
  }

  header {
    background: linear-gradient(135deg, #1a1d27 0%, #22263a 100%);
    border-bottom: 2px solid var(--accent);
    padding: 16px 16px 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: .05em; }
  header p  { font-size: 10px; color: var(--text-dim); margin-top: 2px; font-family: 'DM Mono', monospace; }

  .container { padding: 14px; max-width: 480px; margin: 0 auto; }

  /* タブ */
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 9px 4px;
    cursor: pointer;
    transition: all .15s;
    text-align: center;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #0f1117; font-weight: 700; }

  /* 月度セレクター */
  .month-selector {
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 14px;
  }
  .month-nav {
    background: none; border: none; color: var(--text-dim);
    font-size: 22px; cursor: pointer; padding: 0 10px; line-height: 1;
    transition: color .15s;
  }
  .month-nav:hover { color: var(--accent); }
  .month-display { flex: 1; text-align: center; }
  .month-name { font-size: 17px; font-weight: 700; color: var(--text); }
  .month-name .badge {
    font-size: 10px; background: var(--accent); color: #0f1117;
    font-weight: 700; border-radius: 4px; padding: 1px 6px; margin-left: 6px;
    vertical-align: middle;
  }
  .month-period { font-size: 10px; color: var(--text-dim); font-family: 'DM Mono', monospace; margin-top: 3px; }

  /* 設定バッジ */
  .settings-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .settings-label { font-size: 11px; color: var(--text-dim); }
  .settings-badge {
    font-family: 'DM Mono', monospace; font-size: 11px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; color: var(--accent); padding: 2px 8px;
  }

  /* 総支給額カード */
  .total-card {
    background: linear-gradient(135deg, #1e2030 0%, #272b42 100%);
    border: 2px solid var(--accent);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 14px;
    position: relative; overflow: hidden;
  }
  .total-card::before {
    content: ''; position: absolute; top: -30px; right: -30px;
    width: 100px; height: 100px; background: var(--accent); opacity: .06; border-radius: 50%;
  }
  .total-label { font-size: 10px; font-weight: 700; letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
  .total-amount {
    font-family: 'DM Mono', monospace; font-size: 36px; font-weight: 500;
    color: var(--accent); line-height: 1; margin: 5px 0 6px; letter-spacing: -1px;
  }
  .yen { font-size: .65em; opacity: .7; margin-right: 1px; }
  .total-sub { font-size: 11px; color: var(--text-dim); display: flex; gap: 12px; flex-wrap: wrap; }
  .total-sub strong { color: var(--text); }
  .total-avg {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed rgba(240,192,64,.25);
    display: flex; justify-content: space-between; align-items: center;
  }
  .total-avg-label {
    font-size: 11px; color: var(--text-dim);
    letter-spacing: .05em;
  }
  .total-avg-val {
    font-family: 'DM Mono', monospace;
    font-size: 16px;
    color: var(--text);
    font-weight: 500;
  }

  /* 入力 */
  .input-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; margin-bottom: 14px;
  }
  .input-title { font-size: 10px; font-weight: 700; color: var(--text-dim); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 10px; }
  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500;
    padding: 11px 13px; text-align: right; outline: none; transition: border-color .2s;
  }
  .input-row input:focus { border-color: var(--accent); }
  .input-row input::placeholder { color: var(--text-dim); font-size: 13px; }
  .add-btn {
    background: var(--accent); border: none; border-radius: 8px; color: #0f1117;
    font-family: 'Noto Sans JP', sans-serif; font-size: 14px; font-weight: 700;
    padding: 11px 16px; cursor: pointer; transition: opacity .15s, transform .1s; white-space: nowrap;
  }
  .add-btn:active { opacity: .8; transform: scale(.97); }

  #dateInput {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    padding: 10px 13px;
    outline: none;
    transition: border-color .2s;
    color-scheme: dark;
  }
  #dateInput:focus { border-color: var(--accent); }

  /* 明細リスト */
  .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .list-title { font-size: 10px; font-weight: 700; color: var(--text-dim); letter-spacing: .12em; text-transform: uppercase; }
  .clear-btn {
    background: none; border: 1px solid var(--red); border-radius: 6px;
    color: var(--red); font-size: 11px; font-family: 'Noto Sans JP', sans-serif;
    padding: 3px 10px; cursor: pointer; transition: background .15s;
  }
  .clear-btn:hover { background: rgba(255,96,96,.1); }
  .empty-state { text-align: center; padding: 28px 0; color: var(--text-dim); font-size: 13px; }
  .entry {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 13px; margin-bottom: 7px; display: flex; align-items: center; gap: 10px;
    animation: slideIn .2s ease;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .entry:hover { background: rgba(255,255,255,.03); border-color: var(--text-dim); }
  .entry:active { transform: scale(.99); }
  @keyframes slideIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
  .entry-num {
    font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-dim);
    background: var(--bg); border-radius: 5px; padding: 3px 6px; min-width: 36px; text-align: center;
  }
  .entry-body { flex: 1; min-width: 0; }
  .entry-sales { font-family: 'DM Mono', monospace; font-size: 14px; color: var(--text); }
  .entry-pay   { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--green); margin-top: 2px; }
  .entry-detail { font-size: 10px; color: var(--text-dim); margin-top: 1px; }
  .entry-chevron { color: var(--text-dim); font-size: 18px; line-height: 1; }

  /* 編集モーダル */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
    animation: fadeIn .18s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface);
    border-top: 2px solid var(--accent);
    border-top-left-radius: 18px; border-top-right-radius: 18px;
    width: 100%; max-width: 480px;
    padding: 22px 20px 26px;
    animation: slideUp .25s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title {
    font-size: 14px; font-weight: 700; color: var(--accent);
    letter-spacing: .1em; text-transform: uppercase;
    margin-bottom: 18px;
  }
  .modal-label {
    display: block; font-size: 11px; color: var(--text-dim);
    margin: 12px 0 5px; letter-spacing: .05em;
  }
  .modal-label:first-child { margin-top: 0; }
  .modal-input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: 'DM Mono', monospace; font-size: 16px;
    padding: 11px 13px; outline: none; transition: border-color .2s;
    color-scheme: dark;
  }
  .modal-input:focus { border-color: var(--accent); }
  .modal-input[type="number"] { text-align: right; }
  .modal-preview {

    color: var(--accent);

    font-family: 'DM Mono', monospace;
  }

<body>

<header>
  <h1>🚕 タクシー給料計算</h1>
  <p>月度：16日〜翌月15日 ／ 消費税10% ／ 支給率64%</p>
</header>

<div class="container">

  <div class="tabs">
    <button class="tab active" id="tabMonth"  onclick="switchTab('month')">月度</button>
    <button class="tab"        id="tabAnnual" onclick="switchTab('annual')">年間</button>
  </div>

  <!-- 月度ビュー -->
  <div id="viewMonth">
    <div class="month-selector">
      <button class="month-nav" onclick="changeMonth(-1)">‹</button>
      <div class="month-display">
        <div class="month-name" id="monthName"></div>
        <div class="month-period" id="monthPeriod"></div>
      </div>
      <button class="month-nav" onclick="changeMonth(1)">›</button>
    </div>

    <div class="total-card">
      <div class="total-label">概算 総支給額</div>
      <div class="total-amount"><span class="yen">¥</span><span id="totalPay">0</span></div>
      <div class="total-sub">
        <span>税込売上 <strong id="totalSales">¥0</strong></span>
        <span>税抜売上 <strong id="totalTaxExcl">¥0</strong></span>
        <span id="countBadge">0出番</span>
      </div>
      <div class="total-avg">
        <span class="total-avg-label">1出番平均（税込）</span>
        <span class="total-avg-val" id="avgSales">¥0</span>
      </div>
    </div>

    <div class="input-card">
      <div class="input-title">＋ 売上入力</div>
      <div class="input-row" style="margin-bottom:8px">
        <input type="date" id="dateInput">
      </div>
      <div class="input-row">
        <input type="number" id="salesInput" placeholder="税込売上額（円）" min="0">
        <button class="add-btn" onclick="addEntry()">追加</button>
      </div>
    </div>

    <div class="list-header">
      <div class="list-title">📋 出番明細</div>
      <button class="clear-btn" onclick="clearMonth()">この月を削除</button>
    </div>
    <div id="entryList"></div>
  </div>

  <!-- 年間ビュー -->
  <div id="viewAnnual" style="display:none">
    <div class="year-selector">
      <button class="year-nav" onclick="changeYear(-1)">‹</button>
      <div class="year-display" id="yearDisplay"></div>
      <button class="year-nav" onclick="changeYear(1)">›</button>
    </div>
    <div class="annual-summary">
      <div class="annual-summary-label">年間 概算総支給額</div>
      <div class="annual-summary-amount"><span class="yen">¥</span><span id="annualTotalPay">0</span></div>
      <div class="annual-summary-sub">
        <span>税込売上 <strong id="annualTotalSales">¥0</strong></span>
        <span>総出番数 <strong id="annualTotalCount">0出番</strong></span>
      </div>
    </div>
    <div id="annualList"></div>
  </div>

  <!-- データ管理（共通） -->
  <div class="data-card">
    <div class="data-title">📥 データ管理</div>
    <label class="import-btn">
      CSVファイルを読み込む
      <input type="file" accept=".csv,text/csv,text/plain" onchange="handleFileImport(event)">
    </label>
    <div class="data-hint">日付と税込売上の列があるCSVに対応<br>読み込み時に「追加」か「上書き」を選べます</div>

    <button class="export-btn" id="exportBtn" onclick="exportCSV()">
      📤 CSVファイルを書き出す
    </button>
  </div>

</div>

<!-- インポートモード選択モーダル -->
<div id="importModeModal" class="modal-overlay" style="display:none">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">📥 インポート方法を選択</div>
    <div class="import-mode-summary" id="importModeSummary"></div>

    <button class="mode-btn mode-btn-append" id="importAppendBtn">
      <span class="mode-btn-icon">➕</span>
      <span class="mode-btn-body">
        <span class="mode-btn-title">追加インポート</span>
        <span class="mode-btn-desc">既存データはそのまま、新しいデータを追加</span>
      </span>

    <button class="mode-btn mode-btn-overwrite" id="importOverwriteBtn">
      <span class="mode-btn-icon">♻️</span>
      <span class="mode-btn-body">
        <span class="mode-btn-title">上書きインポート</span>
        <span class="mode-btn-desc">既存データを全削除してCSVの内容に置き換え</span>
      </span>

    <button class="modal-btn cancel" id="importCancelBtn" style="width:100%;margin-top:8px">キャンセル</button>
  </div>
</div>

<!-- 編集モーダル -->
<div id="editModal" class="modal-overlay" style="display:none" onclick="onOverlayClick(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">✎ 出番の編集</div>

    <label class="modal-label">日付</label>
    <input type="date" id="editDate" class="modal-input">

    <label class="modal-label">税込売上額（円）</label>
    <input type="number" id="editSales" class="modal-input" min="0">

    <div class="modal-preview">
      <span id="editPreviewTaxExcl">税抜 ¥0</span>
      <span class="pay-val" id="editPreviewPay">¥0</span>
    </div>

    <div class="modal-actions">
      <button class="modal-btn delete" onclick="deleteFromModal()">削除</button>
      <button class="modal-btn cancel" onclick="closeEditModal()">キャンセル</button>
      <button class="modal-btn save" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<script>
  const TAX_RATE = 10;
  const PAY_RATE = 64;

  let data = {};
  let curYear, curMonth, annualYear;

  // 今日の日付から「現在の月度」を返す
  // 16日以降 → 翌月度、15日以前 → 今月度
  function currentFiscalMonth() {
    const t = new Date();
    const y = t.getFullYear(), m = t.getMonth() + 1, d = t.getDate();
    if (d >= 16) return m === 12 ? { year: y + 1, month: 1 } : { year: y, month: m + 1 };
    return { year: y, month: m };
  }

  function key(y, m) { return y + '-' + m; }
  function zp(n)     { return String(n).padStart(2, '0'); }

  // 月度の期間ラベル: 前月16日〜当月15日
  function periodLabel(y, m) {
    const py = m === 1 ? y - 1 : y;
    const pm = m === 1 ? 12 : m - 1;
    return py + '/' + zp(pm) + '/16 〜 ' + y + '/' + zp(m) + '/15';
  }

  function taxExcl(v) { return v / (1 + TAX_RATE / 100); }
  function calcPay(v) { return taxExcl(v) * (PAY_RATE / 100); }
  function fmt(n)     { return Math.round(n).toLocaleString('ja-JP'); }

  function loadData() {
    try { data = JSON.parse(localStorage.getItem('taxiSalaryData') || '{}'); } catch(e) { data = {}; }
  }
  function saveData() { localStorage.setItem('taxiSalaryData', JSON.stringify(data)); }

  function init() {
    const fm = currentFiscalMonth();
    curYear = fm.year; curMonth = fm.month;
    annualYear = fm.year;
    loadData();
    dateInput.value = todayStr();
    renderMonth();
  }

  function switchTab(tab) {
    document.getElementById('tabMonth').classList.toggle('active', tab === 'month');
    document.getElementById('tabAnnual').classList.toggle('active', tab === 'annual');
    document.getElementById('viewMonth').style.display  = tab === 'month'  ? '' : 'none';
    document.getElementById('viewAnnual').style.display = tab === 'annual' ? '' : 'none';
    if (tab === 'annual') renderAnnual();
  }

  function changeMonth(delta) {
    curMonth += delta;
    if (curMonth > 12) { curMonth = 1;  curYear++; }
    if (curMonth < 1)  { curMonth = 12; curYear--; }
    renderMonth();
  }

  // エントリから売上・日付を取得（旧形式の数値にも対応）
  function salesOf(e) { return typeof e === 'object' ? e.sales : e; }
  function dateOf(e)  { return typeof e === 'object' ? e.date  : null; }
  function fmtDate(d) {
    if (!d) return '';
    const [, m, day] = d.split('-');
    return m + '/' + day;
  }

  function renderMonth() {
    const k = key(curYear, curMonth);
    const entries = data[k] || [];
    const fm = currentFiscalMonth();
    const isCur = curYear === fm.year && curMonth === fm.month;

    document.getElementById('monthName').innerHTML =
      curYear + '年 ' + curMonth + '月度' +
      (isCur ? ' <span class="badge">今月度</span>' : '');
    document.getElementById('monthPeriod').textContent = periodLabel(curYear, curMonth);

    const tSales  = entries.reduce((s, e) => s + salesOf(e), 0);
    const tTaxEx  = entries.reduce((s, e) => s + taxExcl(salesOf(e)), 0);
    const tPay    = entries.reduce((s, e) => s + calcPay(salesOf(e)), 0);

    document.getElementById('totalPay').textContent     = fmt(tPay);
    document.getElementById('totalSales').textContent   = '¥' + fmt(tSales);
    document.getElementById('totalTaxExcl').textContent = '¥' + fmt(tTaxEx);
    document.getElementById('countBadge').textContent   = entries.length + '出番';
    document.getElementById('avgSales').textContent     =
      entries.length > 0 ? '¥' + fmt(tSales / entries.length) : '¥0';

    const list = document.getElementById('entryList');
    if (entries.length === 0) {
      list.innerHTML = '<div class="empty-state">この月度の売上はありません</div>';
      return;
    }
    list.innerHTML = entries.map((e, i) => {
      const v = salesOf(e);
      const d = fmtDate(dateOf(e));
      return `
        <div class="entry" onclick="openEditModal('${k}',${i})">
          <div class="entry-num">${d || (i+1)+'出番'}</div>
          <div class="entry-body">
            <div class="entry-sales">税込 ¥${fmt(v)}</div>
            <div class="entry-pay">支給額 ¥${fmt(calcPay(v))}</div>
            <div class="entry-detail">税抜 ¥${fmt(taxExcl(v))}</div>
          </div>
          <div class="entry-chevron">›</div>
        </div>`;
    }).join('');
  }

  const salesInput = document.getElementById('salesInput');
  const dateInput  = document.getElementById('dateInput');
  salesInput.addEventListener('keydown', e => { if (e.key === 'Enter') addEntry(); });

  // 今日の日付をデフォルトにセット
  function todayStr() {
    const t = new Date();
    return t.getFullYear() + '-' + zp(t.getMonth()+1) + '-' + zp(t.getDate());
  }

  function addEntry() {
    const v = parseFloat(salesInput.value);
    const d = dateInput.value;
    if (!v || v <= 0) { salesInput.focus(); return; }
    if (!d) { dateInput.focus(); return; }
    const k = key(curYear, curMonth);
    if (!data[k]) data[k] = [];
    data[k].push({ date: d, sales: v });
    // 日付順にソート
    data[k].sort((a, b) => a.date.localeCompare(b.date));
    saveData();
    salesInput.value = '';
    salesInput.focus();
    renderMonth();
  }

  /* ===== 編集モーダル ===== */
  let editingKey = null, editingIndex = null;
  const editModal   = document.getElementById('editModal');
  const editDate    = document.getElementById('editDate');
  const editSales   = document.getElementById('editSales');
  const editPrevTE  = document.getElementById('editPreviewTaxExcl');
  const editPrevPay = document.getElementById('editPreviewPay');

  function openEditModal(k, i) {
    const entry = data[k][i];
    editingKey = k;
    editingIndex = i;
    editDate.value  = dateOf(entry) || todayStr();
    editSales.value = salesOf(entry);
    updateEditPreview();
    editModal.style.display = 'flex';
    // スクロールを一番上に戻す
    setTimeout(() => editSales.focus({ preventScroll: true }), 50);
  }

  function closeEditModal() {
    editModal.style.display = 'none';
    editingKey = null;
    editingIndex = null;
  }

  function onOverlayClick(e) {
    // 背景タップでクローズ
    if (e.target.id === 'editModal') closeEditModal();
  }

  function updateEditPreview() {
    const v = parseFloat(editSales.value) || 0;
    if (v <= 0) {
      editPrevTE.textContent = '税抜 ¥0';
      editPrevPay.textContent = '¥0';
      return;
    }
    editPrevTE.textContent  = '税抜 ¥' + fmt(taxExcl(v));
    editPrevPay.textContent = '支給額 ¥' + fmt(calcPay(v));
  }
  editSales.addEventListener('input', updateEditPreview);
  editSales.addEventListener('keydown', e => { if (e.key === 'Enter') saveEdit(); });

  function saveEdit() {
    const v = parseFloat(editSales.value);
    const d = editDate.value;
    if (!v || v <= 0) { editSales.focus(); return; }
    if (!d) { editDate.focus(); return; }

    // 元の月度から削除
    data[editingKey].splice(editingIndex, 1);
    if (data[editingKey].length === 0) delete data[editingKey];

    // 新しい日付に基づいて月度を決定し、追加
    const fm = fiscalOfDate(d);
    const newKey = key(fm.year, fm.month);
    if (!data[newKey]) data[newKey] = [];
    data[newKey].push({ date: d, sales: v });
    data[newKey].sort((a, b) => a.date.localeCompare(b.date));

    saveData();

    // 日付を変えて月度が変わった場合は、新しい月度に移動
    if (newKey !== editingKey) {
      curYear = fm.year; curMonth = fm.month;
    }

    closeEditModal();
    renderMonth();
  }

  function deleteFromModal() {
    if (!confirm('この出番を削除しますか？')) return;
    data[editingKey].splice(editingIndex, 1);
    if (data[editingKey].length === 0) delete data[editingKey];
    saveData();
    closeEditModal();
    renderMonth();
  }

  function clearMonth() {
    const k = key(curYear, curMonth);
    if (!data[k] || data[k].length === 0) return;
    if (confirm(curYear + '年' + curMonth + '月度のデータを全削除しますか？')) {
      delete data[k]; saveData(); renderMonth();
    }
  }

  function changeYear(d) { annualYear += d; renderAnnual(); }

  function renderAnnual() {
    document.getElementById('yearDisplay').textContent = annualYear + '年';
    const fm = currentFiscalMonth();
    let aPay = 0, aSales = 0, aCount = 0, rows = '';

    for (let m = 1; m <= 12; m++) {
      const k = key(annualYear, m);
      const entries = data[k] || [];
      const tSales = entries.reduce((s, e) => s + salesOf(e), 0);
      const tPay   = entries.reduce((s, e) => s + calcPay(salesOf(e)), 0);
      aPay   += tPay;
      aSales += tSales;
      aCount += entries.length;
      const isCur = annualYear === fm.year && m === fm.month;
      rows += `
        <div class="annual-row" onclick="goToMonth(${annualYear},${m})">
          <div class="annual-month${isCur ? ' cur' : ''}">${m}月度${isCur ? ' ●' : ''}</div>
          <div class="annual-count">${entries.length}出番</div>
          <div class="annual-pay${entries.length === 0 ? ' zero' : ''}">${entries.length === 0 ? '—' : '¥' + fmt(tPay)}</div>
          <div class="annual-chevron">›</div>
        </div>`;
    }

    document.getElementById('annualTotalPay').textContent   = fmt(aPay);
    document.getElementById('annualTotalSales').textContent = '¥' + fmt(aSales);
    document.getElementById('annualTotalCount').textContent = aCount + '出番';
    document.getElementById('annualList').innerHTML = '<div class="annual-card">' + rows + '</div>';
  }

  function goToMonth(y, m) { curYear = y; curMonth = m; switchTab('month'); }

  /* ===== CSVインポート ===== */

  // 日付文字列を "YYYY-MM-DD" に正規化
  function parseDate(str) {
    str = str.trim().replace(/^["']|["']$/g, '');
    // 2025-04-16 / 2025/04/16 / 2025/4/16 / 2025年4月16日 などに対応
    const m = str.match(/^(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})日?$/);
    if (m) {
      const y  = parseInt(m[1], 10);
      const mo = parseInt(m[2], 10);
      const d  = parseInt(m[3], 10);
      if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) {
        return y + '-' + zp(mo) + '-' + zp(d);
      }
    }
    return null;
  }

  // 日付文字列から月度を判定
  function fiscalOfDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(n => parseInt(n, 10));
    if (d >= 16) return m === 12 ? { year: y + 1, month: 1 } : { year: y, month: m + 1 };
    return { year: y, month: m };
  }

  function handleFileImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => importCSV(e.target.result);
    reader.onerror = () => alert('ファイルの読み込みに失敗しました');
    reader.readAsText(file, 'UTF-8');
    event.target.value = ''; // 同じファイルを再選択できるようにリセット
  }

  function importCSV(text) {
    // BOMを除去
    text = text.replace(/^\uFEFF/, '');
    const lines = text.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lines.length === 0) { alert('CSVが空です'); return; }

    const newData = {};
    let imported = 0, skipped = 0;

    for (const line of lines) {
      const cols = line.split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
      if (cols.length < 2) continue; // 集計セクションの見出し行など

      // 日付として解釈できる最初の列を探す
      let dateIdx = -1, dateStr = null;
      for (let i = 0; i < cols.length; i++) {
        const d = parseDate(cols[i]);
        if (d) { dateIdx = i; dateStr = d; break; }
      }

      // 日付が見つからない行（ヘッダー、集計行など）はスキップ
      if (dateIdx === -1 || dateIdx + 1 >= cols.length) continue;

      // 日付の次の列を税込売上として解釈
      const sales = parseFloat(cols[dateIdx + 1].replace(/[¥￥,円\s]/g, ''));
      if (!sales || sales <= 0) { skipped++; continue; }

      const fm = fiscalOfDate(dateStr);
      const k  = key(fm.year, fm.month);
      if (!newData[k]) newData[k] = [];
      newData[k].push({ date: dateStr, sales: sales });
      imported++;
    }

    if (imported === 0) {
      alert('有効なデータが見つかりませんでした。\nCSVに「日付」と「税込売上」の列が含まれているか確認してください。');
      return;
    }

    // モード選択ダイアログを表示
    showImportModeDialog(newData, imported);
  }

  // モード選択ダイアログ
  function showImportModeDialog(newData, imported) {
    // 既存データの件数カウント
    let existingCount = 0;
    for (const k in data) existingCount += data[k].length;

    const dialog = document.getElementById('importModeModal');
    document.getElementById('importModeSummary').innerHTML =
      '読み込み対象：<strong>' + imported + '件</strong><br>' +
      '既存データ：<strong>' + existingCount + '件</strong>';

    // 既存データがない場合は「追加」と「上書き」で結果が同じなので追加ボタンのみ強調
    const overwriteBtn = document.getElementById('importOverwriteBtn');
    if (existingCount === 0) {
      overwriteBtn.style.display = 'none';
    } else {
      overwriteBtn.style.display = '';
    }

    // ボタンのハンドラを設定
    document.getElementById('importAppendBtn').onclick = () => doImport(newData, 'append');
    overwriteBtn.onclick = () => doImport(newData, 'overwrite');
    document.getElementById('importCancelBtn').onclick = () => { dialog.style.display = 'none'; };

    dialog.style.display = 'flex';
  }

  function doImport(newData, mode) {
    document.getElementById('importModeModal').style.display = 'none';

    if (mode === 'overwrite') {
      // 上書き：既存データを全削除
      data = {};
    }

    // newDataを既存dataにマージ
    let added = 0, updated = 0;
    for (const k in newData) {
      if (!data[k]) data[k] = [];
      for (const newEntry of newData[k]) {
        // 同じ日付＋同じ金額が既にあればスキップ（完全な重複）
        const dup = data[k].find(e => dateOf(e) === newEntry.date && salesOf(e) === newEntry.sales);
        if (dup) { updated++; continue; }
        data[k].push(newEntry);
        added++;
      }
      // 日付順ソート
      data[k].sort((a, b) => a.date.localeCompare(b.date));
    }

    saveData();

    // 最新データが入っている月度を表示
    const keys = Object.keys(data).sort((a, b) => {
      const [ya, ma] = a.split('-').map(Number);
      const [yb, mb] = b.split('-').map(Number);
      return (ya - yb) || (ma - mb);
    });
    if (keys.length > 0) {
      const [y, m] = keys[keys.length - 1].split('-').map(Number);
      curYear = y; curMonth = m;
    }

    renderMonth();

    const modeLabel = mode === 'overwrite' ? '上書き' : '追加';
    let msg = modeLabel + 'インポート完了！\n\n';
    msg += '新規追加：' + added + '件';
    if (updated > 0) msg += '\n重複スキップ：' + updated + '件';
    alert(msg);
  }

  /* ===== CSVエクスポート ===== */

  function todayFileStamp() {
    const t = new Date();
    return t.getFullYear() + zp(t.getMonth() + 1) + zp(t.getDate());
  }

  // "2026-01-03" → "2026/1/3" （0埋めなし、元CSVと同形式）
  function fmtDateForCSV(dateStr) {
    if (!dateStr) return '';
    const [y, m, d] = dateStr.split('-').map(Number);
    return y + '/' + m + '/' + d;
  }

  function exportCSV() {
    const keys = Object.keys(data).sort((a, b) => {
      const [ya, ma] = a.split('-').map(Number);
      const [yb, mb] = b.split('-').map(Number);
      return (ya - yb) || (ma - mb);
    });

    if (keys.length === 0) {
      alert('書き出せるデータがありません');
      return;
    }

    // BOM + ヘッダー
    let csv = '\uFEFF月度,日付,税込売上,税抜き売上,支給額\r\n';

    // データ行
    for (const k of keys) {
      const [y, m] = k.split('-').map(Number);
      const fiscalLabel = y + '年' + m + '月度';
      for (const e of data[k]) {
        const v    = salesOf(e);
        const d    = dateOf(e);
        const tEx  = Math.round(taxExcl(v));
        const pay  = Math.round(calcPay(v));
        csv += fiscalLabel + ',' + fmtDateForCSV(d) + ',' + v + ',' + tEx + ',' + pay + '\r\n';
      }
    }

    // 空行＋集計セクション
    csv += '\r\n月度別集計\r\n月度,出番数,税込売上合計,税抜き売上合計,支給額合計\r\n';
    for (const k of keys) {
      const [y, m] = k.split('-').map(Number);
      const fiscalLabel = y + '年' + m + '月度';
      const entries = data[k];
      const tSales  = entries.reduce((s, e) => s + salesOf(e), 0);
      const tEx     = Math.round(taxExcl(tSales));
      const tPay    = Math.round(calcPay(tSales));
      csv += fiscalLabel + ',' + entries.length + ',' + tSales + ',' + tEx + ',' + tPay + '\r\n';
    }

    // ダウンロードをトリガー
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'タクシー給料_' + todayFileStamp() + '.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 200);
  }

  init();
</script>

// Service Worker 登録（PWA・オフライン対応）
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function(err) {
      console.log('SW登録失敗:', err);
    });
  });
}
</script>
